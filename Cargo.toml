[package]
name = "pg-guardrails"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only, governed SQL access for AI agents: a Postgres MCP server with statement policy, row caps, column masking and an audit trail"
repository = "https://github.com/inSourceLabs/pg-guardrails"

[workspace]
members = ["."]

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
http = "1"
rmcp = { version = "3.8", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, features = ["ring"] }

[features]
# TLS to the database. Off by default so the plain build stays a single
# dependency-light binary; the licence gate in deny.toml covers the crates this
# feature pulls in.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-pemfile"]


