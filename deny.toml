# cargo-deny policy: permissive-only licence gate.
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"

[bans]
# One binary should not carry two copies of the same crate. Warn rather than deny:
# a transient upstream bump that briefly duplicates a crate surfaces in the gate
# output instead of breaking the build, and the list stays reviewable.
multiple-versions = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
